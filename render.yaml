services:
  - type: web
    name: urban-blood-rave
    runtime: python
    plan: free
    buildCommand: rm -rf deploy && mkdir deploy && python -c "import zipfile; zipfile.ZipFile('game_bundle.zip').extractall('deploy')" && pip install -r deploy/requirements.txt
    startCommand: cd deploy && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: HOST_KEY
        sync: false

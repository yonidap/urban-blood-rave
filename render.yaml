services:
  - type: web
    name: urban-blood-rave
    runtime: python
    plan: free
    buildCommand: python bootstrap.py && pip install -r deployed/requirements.txt
    startCommand: cd deployed && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: HOST_KEY
        sync: false
